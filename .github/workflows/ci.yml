name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal pkg)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  security:
    name: govulncheck + gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gosec
        continue-on-error: true # advisory for now; tighten once findings are triaged
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" ./...

  e2e:
    name: docker compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run end-to-end test (knock -> TOTP -> firewall + key gated SSH -> auto-revoke)
        run: sh deploy/compose/test-e2e.sh
